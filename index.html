    <script src="./script.js"></script>
    
    <script>
      // Referência para o botão do widget
      let botaoWidgetOriginal = null;
      
      // Função para esconder o botão do widget
      function esconderBotaoWidget() {
        const seletores = [
          'button[style*="position: fixed"]',
          '[data-wtt-toggle]',
          'button.wtt-button'
        ];
        
        for (let seletor of seletores) {
          const botoes = document.querySelectorAll(seletor);
          botoes.forEach(botao => {
            if (botao.id !== 'meu-botao-chat') {
              botao.style.setProperty('display', 'none', 'important');
              botao.style.setProperty('visibility', 'hidden', 'important');
              botao.style.setProperty('pointer-events', 'none', 'important');
              botaoWidgetOriginal = botao;
              console.log('Botão do widget escondido:', botao);
            }
          });
        }
      }
      
      // Função para abrir o widget clicando no botão escondido
      function abrirWidget() {
        console.log('Abrindo widget...');
        
        if (!botaoWidgetOriginal) {
          // Procura pelo botão do widget
          const seletores = [
            'button[style*="position: fixed"]',
            '[data-wtt-toggle]',
            'button.wtt-button'
          ];
          
          for (let seletor of seletores) {
            const botoes = document.querySelectorAll(seletor);
            for (let botao of botoes) {
              if (botao.id !== 'meu-botao-chat') {
                botaoWidgetOriginal = botao;
                break;
              }
            }
            if (botaoWidgetOriginal) break;
          }
        }
        
        if (botaoWidgetOriginal) {
          console.log('Clicando no botão do widget...');
          botaoWidgetOriginal.click();
        } else {
          console.error('Botão do widget não encontrado!');
        }
      }
      
      // Quando a página carregar
      window.addEventListener('load', function() {
        console.log('Página carregada - iniciando setup');
        
        // Esconde o botão do widget
        esconderBotaoWidget();
        
        // Adiciona evento ao seu botão
        const meuBotao = document.getElementById('meu-botao-chat');
        if (meuBotao) {
          meuBotao.addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Seu botão foi clicado!');
            abrirWidget();
          });
          console.log('✅ Botão personalizad configurado');
        }
      });
      
      // Observa quando novos elementos são adicionados (para esconder o botão do widget caso apareça depois)
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          mutation.addedNodes.forEach(function(node) {
            if (node.tagName === 'BUTTON' && node.id !== 'meu-botao-chat') {
              const style = window.getComputedStyle(node);
              if (style.position === 'fixed') {
                console.log('Novo botão fixo detectado - escondendo');
                node.style.setProperty('display', 'none', 'important');
                node.style.setProperty('visibility', 'hidden', 'important');
                node.style.setProperty('pointer-events', 'none', 'important');
                botaoWidgetOriginal = node;
              }
            }
          });
        });
      });
      
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
