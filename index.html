      /* Estilo do seu botão personalizado */

      /* Esconde o iframe/widget inicialmente */

      iframe[src*="whaticket"] {
        display: none !important;
      }
      
      /* Quando o widget estiver "aberto", mostra o iframe */

      iframe[src*="whaticket"].widget-aberto {
        display: block !important;

    <!-- Script para controlar o widget -->
    <script>
      // Variável para controlar se o widget está aberto
      let widgetAberto = false;
      
      // Função para tentar encontrar e controlar o widget
      function toggleWidget() {
        console.log('Tentando abrir/fechar widget...');
        
        // Procura o iframe do widget (pode demorar alguns segundos para carregar)
        const iframe = document.querySelector('iframe[src*="widget"]') || 
                       document.querySelector('iframe[src*="whaticket"]') ||
                       document.querySelector('iframe');
        
        if (iframe) {
          console.log('Iframe encontrado:', iframe);
          
          if (widgetAberto) {
            // Fecha o widget
            iframe.classList.remove('widget-aberto');
            widgetAberto = false;
            console.log('Widget fechado');
          } else {
            // Abre o widget
            iframe.classList.add('widget-aberto');
            widgetAberto = true;
            console.log('Widget aberto');
          }
        } else {
          console.log('Widget ainda não carregou. Procurando por outros elementos...');
          
          // Tenta encontrar qualquer elemento do widget
          const todosIframes = document.querySelectorAll('iframe');
          console.log('Total de iframes encontrados:', todosIframes.length);
          
          if (todosIframes.length > 0) {
            const ultimoIframe = todosIframes[todosIframes.length - 1];
            ultimoIframe.classList.add('widget-aberto');
            widgetAberto = true;
            console.log('Forçando abertura do último iframe');
          } else {
            alert('Widget ainda está carregando. Aguarde alguns segundos e tente novamente.');
          }
        }
      }
      
      // Aguarda o DOM carregar
      document.addEventListener('DOMContentLoaded', function() {
        const meuBotao = document.getElementById('meu-botao-chat');
        
        if (meuBotao) {
          meuBotao.addEventListener('click', function() {
            console.log('Botão clicado!');
            toggleWidget();
          });
          console.log('Event listener adicionado ao botão');
        } else {
          console.error('Botão não encontrado!');
        }
      });
      
      // Observa quando novos elementos são adicionados à página (para pegar o iframe do widget)
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.addedNodes.length) {
            mutation.addedNodes.forEach(function(node) {
              if (node.tagName === 'IFRAME') {
                console.log('Novo iframe detectado:', node);
              }
            });
          }
        });
      });
      
      // Inicia o observador
      observer.observe(document.body, { 
        childList: true, 
        subtree: true 
      });
    </script>
