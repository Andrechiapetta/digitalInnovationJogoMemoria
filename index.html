    <script>
      // Função para encontrar e clicar no botão do widget
      function abrirWidgetAutomaticamente() {
        console.log('Procurando botão do widget...');
        
        // Tenta vários seletores para encontrar o botão do widget
        const botoesWidget = [
          document.querySelector('button[style*="position: fixed"]'),
          document.querySelector('button[style*="bottom"]'),
          document.querySelector('[data-wtt-toggle]'),
          document.querySelector('button.wtt-button'),
          // Procura por todos os botões e pega o que está fixo
          ...document.querySelectorAll('button')
        ];
        
        // Filtra null e encontra o primeiro botão que provavelmente é do widget
        for (let botao of botoesWidget) {
          if (botao && botao.id !== 'meu-botao-chat') {
            // Verifica se é o botão do widget pela posição ou estilo
            const style = window.getComputedStyle(botao);
            if (style.position === 'fixed') {
              console.log('Botão do widget encontrado:', botao);
              botao.click();
              return true;
            }
          }
        }
        
        console.log('Botão do widget não encontrado ainda');
        return false;
      }
      
      // Quando a página carregar
      window.addEventListener('load', function() {
        console.log('Página carregada');
        
        // Adiciona evento ao seu botão
        const meuBotao = document.getElementById('meu-botao-chat');
        if (meuBotao) {
          meuBotao.addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Seu botão foi clicado!');
            
            // Tenta abrir o widget imediatamente
            const sucesso = abrirWidgetAutomaticamente();
            
            if (!sucesso) {
              // Se não encontrou logo, tenta de novo após 500ms
              console.log('Tentando de novo em 500ms...');
              setTimeout(() => {
                abrirWidgetAutomaticamente();
              }, 500);
            }
          });
          console.log('Botão configurado com sucesso');
        }
      });
      
      // Observa mudanças no DOM para pegar o botão do widget assim que aparecer
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          mutation.addedNodes.forEach(function(node) {
            // Se um novo elemento foi adicionado e for um botão
            if (node.tagName === 'BUTTON' || (node.querySelectorAll && node.querySelectorAll('button').length > 0)) {
              console.log('Novo elemento adicionado ao DOM');
            }
          });
        });
      });
      
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
