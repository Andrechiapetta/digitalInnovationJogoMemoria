<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memoria</title>
  <link rel="stylesheet" href="./style.css">

  <!-- Configuração do widget -->
  <script>
    window.WTT_API = {
      config: {
        token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJjb21wYW55SWQiOiIyNmY1ZmU1Ny04MmUxLTRjMDUtOTQ0My0yNjUzNjkzOTM5NjEiLCJjb25uZWN0aW9uSWQiOiIxNTAwZTExYi0xMjJmLTRjYTAtYWQ5ZS05Y2VhNzhhMDhmNGUiLCJpYXQiOjE3MzA4NDMxNzd9.CzlMPbgFcJFEzbsz_JhgZZvR2h9ws1QZkKo-_7nC-Ok",
        title: "¡Bienvenido al soporte!",
        subtitle: "¿Cómo podemos ayudar?",
        position: "right",
        toggleButtonEnabled: false, // oculta o botão flutuante
        isAudioEnabled: false
      }
    };
  </script>
</head>

<body>
  <!-- 🔹 Botão fixo no canto inferior direito -->
  <button id="openChat" style="
    position: fixed;
    bottom: 30px;
    right: 30px;
    background-color: #42a5f5;
    color: white;
    border: none;
    border-radius: 50px;
    padding: 12px 20px;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    z-index: 9999;
  ">
    Iniciar chat
  </button>

  <!-- 🔹 Conteúdo original do jogo -->
  <main class="memory-game">
    <div class="card" data-card="bowser">
      <img class="card-front" src="./img/bowser.jpg" alt="Face da carta">
      <img class="card-back" src="./img/box.png" alt="Verso da carta">
    </div>
    <div class="card" data-card="luigi">
      <img class="card-front" src="./img/luigi.png" alt="Face da carta">
      <img class="card-back" src="./img/box.png" alt="Verso da carta">
    </div>
    <div class="card" data-card="mario">
      <img class="card-front" src="./img/mario.png" alt="Face da carta">
      <img class="card-back" src="./img/box.png" alt="Verso da carta">
    </div>
    <div class="card" data-card="peach">
      <img class="card-front" src="./img/peach.png" alt="Face da carta">
      <img class="card-back" src="./img/box.png" alt="Verso da carta">
    </div>
    <div class="card" data-card="toad">
      <img class="card-front" src="./img/toad.png" alt="Face da carta">
      <img class="card-back" src="./img/box.png" alt="Verso da carta">
    </div>
    <div class="card" data-card="yoshi">
      <img class="card-front" src="./img/yoshi.png" alt="Face da carta">
      <img class="card-back" src="./img/box.png" alt="Verso da carta">
    </div>
  </main>

  <!-- 🔹 Script do jogo -->
  <script src="./script.js"></script>

  <!-- 🔹 Carrega o widget de forma controlada -->
  <script>
    // Carrega o script do Whaticket e avisa quando estiver pronto
    function loadWidgetScript(callback) {
      const script = document.createElement("script");
      script.src = "https://public.whaticket.com/widget/staging/wtt-widget-default.js";
      script.crossOrigin = "*";
      script.onload = callback; // dispara quando o script termina de carregar
      document.body.appendChild(script);
    }

    // Função para abrir o chat
    function openChat() {
      if (window.WTT_API && typeof window.WTT_API.openWidget === "function") {
        window.WTT_API.openWidget();
      } else {
        alert("El chat todavía se está cargando, intenta nuevamente en un momento.");
      }
    }

    // Carrega o script assim que a página termina de carregar
    window.addEventListener("load", () => {
      loadWidgetScript(() => {
        console.log("Widget Whaticket cargado correctamente");
      });
    });

    // Ativa o botão
    document.getElementById("openChat").addEventListener("click", openChat);
  </script>
</body>
</html>
