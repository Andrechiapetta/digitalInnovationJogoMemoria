    <!-- Script SIMPLES para abrir o widget -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const meuBotao = document.getElementById('meu-botao-chat');
        
        meuBotao.addEventListener('click', function() {
          // Usa a API oficial do widget para abrir/fechar
          if (window.WTT_API && window.WTT_API.toggle) {
            window.WTT_API.toggle();
          } else {
            console.error('Widget ainda não carregou');
          }
        });
      });
