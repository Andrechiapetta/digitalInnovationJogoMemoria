<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memoria</title>
  <link rel="stylesheet" href="./style.css">

  <!-- Configuração do widget -->
  <script>
    window.WTT_API = {
      config: {
        token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJjb21wYW55SWQiOiIyNmY1ZmU1Ny04MmUxLTRjMDUtOTQ0My0yNjUzNjkzOTM5NjEiLCJjb25uZWN0aW9uSWQiOiIxNTAwZTExYi0xMjJmLTRjYTAtYWQ5ZS05Y2VhNzhhMDhmNGUiLCJpYXQiOjE3MzA4NDMxNzd9.CzlMPbgFcJFEzbsz_JhgZZvR2h9ws1QZkKo-_7nC-Ok",
        title: "¡Bienvenido al soporte!",
        subtitle: "¿Cómo podemos ayudar?",
        position: "right",
        toggleButtonEnabled: false, // 👈 Desativa o botão padrão do Whaticket
        isAudioEnabled: false
      }
    };
  </script>

  <!-- Script do widget -->
  <script async crossorigin="*" src="https://public.whaticket.com/widget/staging/wtt-widget-default.js"></script>
</head>
<body>
  <main class="memory-game">
    <h1>Jogo da Memoria</h1>

    <!-- Seu botão personalizado -->
    <button id="openChat" style="
      background-color: #42a5f5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
    ">
      Iniciar chat
    </button>

    <!-- Cartas do jogo -->
    <div class="card" data-card="bowser">
      <img class="card-front" src="./img/bowser.jpg" alt="Face da carta">
      <img class="card-back" src="./img/box.png" alt="Verso da carta">
    </div>
    <div class="card" data-card="luigi">
      <img class="card-front" src="./img/luigi.png" alt="Face da carta">
      <img class="card-back" src="./img/box.png" alt="Verso da carta">
    </div>
    <div class="card" data-card="mario">
      <img class="card-front" src="./img/mario.png" alt="Face da carta">
      <img class="card-back" src="./img/box.png" alt="Verso da carta">
    </div>
    <div class="card" data-card="peach">
      <img class="card-front" src="./img/peach.png" alt="Face da carta">
      <img class="card-back" src="./img/box.png" alt="Verso da carta">
    </div>
    <div class="card" data-card="toad">
      <img class="card-front" src="./img/toad.png" alt="Face da carta">
      <img class="card-back" src="./img/box.png" alt="Verso da carta">
    </div>
    <div class="card" data-card="yoshi">
      <img class="card-front" src="./img/yoshi.png" alt="Face da carta">
      <img class="card-back" src="./img/box.png" alt="Verso da carta">
    </div>
  </main>

  <!-- Script do jogo -->
  <script src="./script.js"></script>

  <!-- Script para controlar o botão do chat -->
  <script>
    // Função para abrir o widget quando o botão for clicado
    document.getElementById("openChat").addEventListener("click", () => {
      if (window.WTT_API && typeof window.WTT_API.openWidget === "function") {
        window.WTT_API.openWidget(); // abre o chat
      } else {
        alert("O chat ainda está carregando. Tente novamente em alguns segundos.");
      }
    });
  </script>
</body>
</html>
