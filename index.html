    <script>
      // Variável para controlar o estado do widget
      let widgetAberto = false;
      let widgetIframe = null;
      
      // Função para esconder o widget inicialmente
      function esconderWidgetInicial() {
        // Aguarda um pouco para o widget carregar
        setTimeout(() => {
          const iframe = document.querySelector('iframe[id="wtt-widget-iframe"]') || 
                         document.querySelector('iframe[src*="widget"]') ||
                         document.querySelector('iframe[src*="whaticket"]');
          
          if (iframe) {
            widgetIframe = iframe;
            // Esconde o widget mudando o style inline diretamente
            iframe.style.setProperty('display', 'none', 'important');
            console.log('Widget escondido inicialmente');
          }
        }, 1000); // Aguarda 1 segundo
      }
      
      // Função para abrir/fechar o widget
      function toggleWidget() {
        console.log('Toggle widget - Estado atual:', widgetAberto ? 'aberto' : 'fechado');
        
        // Se ainda não encontrou o iframe, procura novamente
        if (!widgetIframe) {
          widgetIframe = document.querySelector('iframe[id="wtt-widget-iframe"]') || 
                         document.querySelector('iframe[src*="widget"]') ||
                         document.querySelector('iframe[src*="whaticket"]');
        }
        
        if (widgetIframe) {
          if (widgetAberto) {
            // Fecha o widget
            widgetIframe.style.setProperty('display', 'none', 'important');
            widgetAberto = false;
            console.log('Widget fechado');
          } else {
            // Abre o widget - REMOVE o display none e deixa aparecer
            widgetIframe.style.removeProperty('display');
            widgetAberto = true;
            console.log('Widget aberto');
          }
        } else {
          console.error('Iframe do widget não encontrado!');
          // Tenta encontrar qualquer iframe
          const todosIframes = document.querySelectorAll('iframe');
          console.log('Iframes na página:', todosIframes.length);
          todosIframes.forEach((iframe, index) => {
            console.log(`Iframe ${index}:`, iframe.src || iframe.id);
          });
        }
      }
      
      // Quando a página carregar
      window.addEventListener('load', function() {
        console.log('Página carregada');
        
        // Esconde o widget inicialmente
        esconderWidgetInicial();
        
        // Adiciona evento ao botão
        const meuBotao = document.getElementById('meu-botao-chat');
        if (meuBotao) {
          meuBotao.addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Botão clicado!');
            toggleWidget();
          });
          console.log('Botão configurado com sucesso');
        }
      });
      
      // Observa quando o iframe é adicionado
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          mutation.addedNodes.forEach(function(node) {
            if (node.tagName === 'IFRAME') {
              console.log('Novo iframe detectado:', node.id || node.src);
              // Se for o iframe do widget, esconde ele
              if (!widgetIframe && 
                  (node.id === 'wtt-widget-iframe' || 
                   (node.src && (node.src.includes('widget') || node.src.includes('whaticket'))))) {
                widgetIframe = node;
                node.style.setProperty('display', 'none', 'important');
                console.log('Widget iframe capturado e escondido');
              }
            }
          });
        });
      });
      
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
