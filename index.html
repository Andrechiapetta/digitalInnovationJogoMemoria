    <!-- Script para controlar o widget através do seu botão -->
    <script>
      // Aguarda o carregamento completo da página
      window.addEventListener('load', function() {
        
        // Encontra o seu botão personalizado
        const meuBotao = document.getElementById('meu-botao-chat');
        
        // Adiciona o evento de clique no seu botão
        meuBotao.addEventListener('click', function() {
          
          // MÉTODO 1: Procura pelo botão original do widget (que está escondido) e simula um clique
          // O widget geralmente cria um botão, então podemos procurar por ele
          const botaoOriginal = document.querySelector('[data-wtt-toggle]') || 
                                document.querySelector('button[style*="position: fixed"]');
          
          if (botaoOriginal) {
            botaoOriginal.click(); // Simula clique no botão escondido
            return;
          }
          
          // MÉTODO 2: Se não encontrar o botão, procura pelo iframe ou container do widget
          const widgetFrame = document.querySelector('iframe[src*="whaticket"]') ||
                              document.querySelector('iframe[src*="widget"]') ||
                              document.querySelector('[data-wtt-widget]') ||
                              document.querySelector('div[id*="wtt"]');
          
          if (widgetFrame) {
            // Torna o widget visível
            widgetFrame.style.display = 'block';
            widgetFrame.style.visibility = 'visible';
            widgetFrame.style.opacity = '1';
          } else {
            console.log('Widget ainda não carregado. Aguarde alguns segundos.');
          }
        });
      });
    </script>
